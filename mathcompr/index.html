<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados de competencia: Grupo MATHCOM PR</title>
<style>
:root {
  --papel: #EEF1F7;
  --superficie: #FFFFFF;
  --marca: #17235A;
  --sobre-marca: #FFFFFF;
  --titulo: #17235A;
  --texto: #141B36;
  --texto-suave: #55607F;
  --linea: #CBD3E4;
  --linea-fuerte: #8E9AB8;
  --cab-tabla: #E4E9F5;
  --fila-alt: #F6F8FC;
  --oro: #C9962B;
  --oro-suave: #F7ECCD;
  --plata: #A9B2C4;
  --bronce: #A7673A;
  --sobre-bronce: #FFFFFF;
  --alerta: #B3261E;
  --alerta-suave: #FBE9E7;
  --ok: #1E7A4F;
  --enlace: #1E3A9A;
  --foco: #17235A;
  --f-num: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-texto: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
[data-tema="noche"] {
  --papel: #0B1029;
  --superficie: #131A3E;
  --marca: #24338A;
  --titulo: #DDE3FF;
  --texto: #E6EAF8;
  --texto-suave: #A4ADCC;
  --linea: #2A3468;
  --linea-fuerte: #4C5890;
  --cab-tabla: #1B2452;
  --fila-alt: #171F48;
  --oro: #E3B34C;
  --oro-suave: #3A3113;
  --plata: #AEB7CB;
  --bronce: #C98852;
  --sobre-bronce: #1B1300;
  --alerta: #FF8A80;
  --alerta-suave: #4A1B1B;
  --ok: #2F8F62;
  --enlace: #B9C6FF;
  --foco: #E3B34C;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papel); color: var(--texto); font: 15px/1.45 var(--f-texto); }
h1, h2, h3, h4 { font-family: var(--f-num); color: var(--titulo); margin: 0; font-weight: 600; letter-spacing: .01em; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--enlace); }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.tenue { color: var(--texto-suave); }

/* Cabecera */
.cabecera { background: var(--marca); color: var(--sobre-marca); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 14px 22px 12px; border-bottom: 4px solid var(--oro); }
.cabecera h1 { color: var(--sobre-marca); font-size: 1.6rem; line-height: 1.1; }
.cabecera p { margin: 3px 0 0; font-size: .82rem; opacity: .82; }
.herramientas { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.cabecera :focus-visible { outline-color: #FFFFFF; }
.btn-cab { background: transparent; color: var(--sobre-marca); border: 1px solid rgba(255,255,255,.5); border-radius: 4px; padding: 5px 11px; cursor: pointer; }
.btn-cab:hover:not(:disabled) { background: rgba(255,255,255,.16); }
.btn-cab:disabled { opacity: .4; cursor: default; }
.interruptor { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.guardado { font-size: .8rem; opacity: .88; margin-right: 6px; width: 27em; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.guardado.mal { background: #B3261E; color: #FFFFFF; padding: 3px 8px; border-radius: 4px; opacity: 1; text-align: center; }

/* Pestañas */
.pestanas { display: flex; gap: 2px; padding: 0 14px; background: var(--superficie); border-bottom: 1px solid var(--linea); overflow-x: auto; }
.pestanas a { display: inline-flex; align-items: baseline; gap: 7px; padding: 11px 13px 8px; text-decoration: none; color: var(--texto-suave); border-bottom: 3px solid transparent; white-space: nowrap; font-family: var(--f-num); font-size: 1.04rem; }
.pestanas a:hover { color: var(--titulo); }
.pestanas a.activa { color: var(--titulo); border-bottom-color: var(--oro); font-weight: 600; }
.et { font-size: .72rem; padding: 1px 7px; border-radius: 9px; background: var(--papel); color: var(--texto-suave); font-family: var(--f-texto); font-weight: 400; }
.et.ok { background: var(--ok); color: #FFFFFF; }
.et.alerta { background: var(--oro); color: #1B1300; }

main { padding: 20px 22px 70px; max-width: 1500px; margin: 0 auto; }
.encabezado-vista { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 34px; margin-bottom: 14px; }
.encabezado-vista h2 { font-size: 1.95rem; line-height: 1; }

/* Pista de rondas */
.pista { list-style: none; display: flex; align-items: center; gap: 4px; margin: 0; padding: 0; }
.pista li { width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--f-num); font-size: .98rem; border: 1.5px solid var(--linea-fuerte); color: var(--texto-suave); background: var(--superficie); }
.pista li.hecha { background: var(--marca); border-color: var(--marca); color: var(--sobre-marca); }
.pista li.actual { border-color: var(--oro); box-shadow: inset 0 0 0 2px var(--oro); color: var(--titulo); font-weight: 600; }
.pista li.receso { width: auto; height: auto; border: 0; background: none; font-family: var(--f-texto); font-size: .7rem; color: var(--texto-suave); padding: 0 5px; }
.estado-nivel { margin: 0 0 4px; min-height: 1.45em; color: var(--texto-suave); }

/* Bloques */
.bloque { margin: 24px 0 0; }
.bloque > h3, .bloque > summary, .fila-titulo { border-bottom: 2px solid var(--titulo); margin-bottom: 8px; padding-bottom: 5px; }
.bloque > h3, .fila-titulo h3 { font-size: 1.28rem; }
.fila-titulo { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.bloque > summary { cursor: pointer; font-family: var(--f-num); font-size: 1.28rem; font-weight: 600; color: var(--titulo); }
.bloque > summary .cuenta { margin-left: 10px; }
.cuenta { font-family: var(--f-texto); font-size: .82rem; font-weight: 400; color: var(--texto-suave); margin-left: 8px; letter-spacing: 0; }
.ayuda { margin: 0 0 10px; color: var(--texto-suave); font-size: .9rem; max-width: 80ch; }
.vacio { padding: 18px; border: 1px dashed var(--linea-fuerte); color: var(--texto-suave); background: var(--superficie); margin: 0; }
.acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 10px; }

/* Avisos */
.aviso-linea { padding: 8px 12px; border-left: 4px solid var(--titulo); background: var(--superficie); margin: 0; }
.aviso-linea.atencion { border-left-color: var(--oro); background: var(--oro-suave); }
.aviso-linea.grave { border-left-color: var(--alerta); background: var(--alerta-suave); }
.solo-oculto { display: none; }
.sin-escuelas .solo-oculto { display: block; }
.sin-escuelas .solo-visible { display: none !important; }
.sin-escuelas .col-escuela { display: none !important; }

/* Tablas */
.tabla-desliz { overflow-x: auto; border: 1px solid var(--linea-fuerte); background: var(--superficie); }
.tabla-desliz.ajustada { width: fit-content; max-width: 100%; }
table.hoja.fija { width: auto; }
.hoja.fija .c-mesa { width: 84px; }
.hoja.fija .c-p { width: 46px; }
.hoja.fija .c-total { width: 72px; }
.hoja.fija .c-pos { width: 124px; }
.hoja.fija .c-esc { min-width: 220px; }
.hoja .c-pos, .hoja .c-mesa { white-space: nowrap; }
table.hoja { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.hoja th, .hoja td { border: 1px solid var(--linea); padding: 5px 8px; text-align: center; }
.hoja thead th { background: var(--cab-tabla); color: var(--titulo); font-family: var(--f-num); font-weight: 600; font-size: .95rem; border-bottom: 2px solid var(--linea-fuerte); white-space: nowrap; }
.hoja tbody tr:nth-child(even) { background: var(--fila-alt); }
.hoja .c-esc { text-align: left; min-width: 150px; }
.hoja .c-crit, .hoja .c-obs { text-align: left; }
.hoja tbody th.c-mesa { position: sticky; left: 0; z-index: 1; background: var(--superficie); min-width: 60px; }
.hoja tbody tr:nth-child(even) th.c-mesa { background: var(--fila-alt); }
.hoja thead th.c-mesa { position: sticky; left: 0; z-index: 2; }
.num-mesa { font-family: var(--f-num); font-size: 1.18rem; font-weight: 600; color: var(--titulo); }
.hoja .c-total { font-family: var(--f-num); font-size: 1.14rem; font-weight: 600; }
.hoja .c-p, .hoja td.c-d { font-family: var(--f-num); font-size: 1.04rem; }
.hoja .receso { border-right: 3px double var(--linea-fuerte); }
.hoja tr.premio td.c-total { color: var(--titulo); }
.hoja tr.fila-dq td, .hoja tr.fila-dq th, .hoja tr.fila-dq .num-mesa, .hoja tr.fila-dq input { color: var(--texto-suave); }
.marca-ap { margin-left: 6px; font-family: var(--f-texto); font-size: .7rem; font-weight: 400; color: var(--alerta); }

/* Captura */
.captura tbody th, .captura tbody td { height: 38px; padding-top: 0; padding-bottom: 0; }
.captura td.c-p { padding: 0; width: 46px; min-width: 42px; }
.captura td.c-p input { display: block; width: 100%; height: 37px; border: 0; border-radius: 0; background: transparent; text-align: center; font-family: var(--f-num); font-size: 1.12rem; padding: 0; }
.captura td.pend input { color: var(--texto-suave); }
.captura td.c-p input:hover { background: var(--cab-tabla); }
.captura td.c-p input:focus { outline: 2px solid var(--foco); outline-offset: -2px; background: var(--oro-suave); }
.captura td.c-p input.invalido { background: var(--alerta-suave); color: var(--alerta); outline-color: var(--alerta); }
.captura thead th.hecha { box-shadow: inset 0 -3px 0 var(--marca); }
[data-tema="noche"] .captura thead th.hecha { box-shadow: inset 0 -3px 0 var(--titulo); }
.captura thead th.actual { box-shadow: inset 0 -3px 0 var(--oro); }
.captura tbody tr:focus-within th.c-mesa { background: var(--marca); }
.captura tbody tr:focus-within th.c-mesa .num-mesa { color: var(--sobre-marca); }

/* Posiciones */
.pos { display: inline-grid; place-items: center; min-width: 30px; height: 26px; vertical-align: middle; padding: 0 6px; font-family: var(--f-num); font-size: 1.08rem; font-weight: 600; }
.pos.p1 { background: var(--oro); color: #1B1300; }
.pos.p2 { background: var(--plata); color: #0F1424; }
.pos.p3 { background: var(--bronce); color: var(--sobre-bronce); }
.pos.p4, .pos.p5 { box-shadow: inset 0 0 0 2px var(--titulo); color: var(--titulo); }
.emp { margin-left: 6px; font-size: .74rem; color: var(--texto-suave); }
.pos-nula { color: var(--texto-suave); }
.pos-dq { font-size: .8rem; color: var(--alerta); }

/* Campos y botones */
.campo { border: 1px solid var(--linea-fuerte); border-radius: 3px; background: var(--superficie); padding: 5px 8px; min-height: 32px; max-width: 100%; }
.hoja td .campo { width: 100%; }
.campo.num { width: 74px; text-align: center; font-family: var(--f-num); font-size: 1.05rem; }
.hoja td .campo.num { width: 70px; }
.campo.ancho { flex: 0 1 420px; width: 420px; min-width: 0; max-width: 100%; }
.btn { background: var(--superficie); color: var(--titulo); border: 1.5px solid var(--titulo); border-radius: 4px; padding: 6px 13px; cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--cab-tabla); }
.btn.primario { background: var(--marca); color: var(--sobre-marca); border-color: var(--marca); }
.btn.primario:hover { filter: brightness(1.15); }
.btn.peligro { color: var(--alerta); border-color: var(--alerta); }
.btn.peligro-lleno { background: #B3261E; border-color: #B3261E; color: #FFFFFF; }
.btn-texto { background: none; border: 0; color: var(--enlace); cursor: pointer; padding: 2px 4px; text-decoration: underline; }
.etiqueta-campo { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.etiqueta-campo.larga { display: flex; flex-wrap: wrap; }

/* Configuración */
.rejilla-niveles { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 26px; align-items: start; }
.nota-niveles { margin: 18px 0 -12px; }
.panel-escuelas .tabla-desliz { max-width: 860px; }

/* Desempates */
.grupo { border-left: 4px solid var(--oro); padding: 2px 0 2px 14px; margin: 0 0 18px; }
.grupo h4 { font-size: 1.08rem; margin-bottom: 4px; }
.grupo ul { margin: 8px 0 0; padding-left: 18px; }
.grupo td.c-d { width: 120px; }
.grupo .c-crit { min-width: 210px; }

/* Vista pública */
.barra-publica { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 16px; }
.segmento { display: inline-flex; }
.segmento button { border: 1.5px solid var(--titulo); background: var(--superficie); color: var(--titulo); padding: 6px 14px; cursor: pointer; margin-left: -1.5px; font-family: var(--f-num); font-size: 1.02rem; }
.segmento button:first-child { margin-left: 0; }
.segmento button.activo { background: var(--marca); border-color: var(--marca); color: var(--sobre-marca); }
.segmento button:disabled { opacity: .45; cursor: default; }
.lienzo-publico { background: var(--papel); font-size: clamp(15px, 1.3vw, 26px); }
.lienzo-publico:fullscreen { padding: 3vh 3vw; overflow: auto; }
.cab-publica { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 22px; border-bottom: 4px solid var(--oro); padding-bottom: 8px; margin-bottom: 12px; }
.cab-publica h2 { font-size: 2.2em; line-height: 1.05; }
.cab-publica .evento { margin: 0; width: 100%; color: var(--texto-suave); font-size: .92em; }
.cab-publica .estado { margin: 0; font-size: 1.05em; }
.lienzo-publico .hoja th, .lienzo-publico .hoja td { padding: .34em .5em; font-size: 1em; }
.lienzo-publico .hoja .c-total, .lienzo-publico .num-mesa { font-size: 1.2em; }
.lienzo-publico .hoja .c-p { font-size: 1.05em; }
.lienzo-publico .pos { font-size: 1.1em; min-width: 1.9em; height: 1.75em; }
.lienzo-publico .emp, .lienzo-publico .pos-dq { font-size: .68em; }
.notas-publicas { margin: 12px 0 0; padding-left: 20px; color: var(--texto-suave); font-size: .82em; }

/* Reglas */
.criterios { margin: 0; padding-left: 20px; max-width: 86ch; }
.criterios > li { margin-bottom: 8px; }
.criterios ol { margin: 4px 0; }

/* Avisos emergentes y diálogos */
.avisos { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; gap: 6px; z-index: 50; pointer-events: none; }
.globo { background: #141B36; color: #FFFFFF; padding: 9px 16px; border-radius: 4px; box-shadow: 0 4px 14px rgba(10,16,48,.4); max-width: min(90vw, 580px); border-left: 4px solid var(--oro); }
#capa-dialogo { position: fixed; inset: 0; background: rgba(8,12,38,.6); display: grid; place-items: center; z-index: 60; padding: 16px; }
#capa-dialogo[hidden] { display: none; }
.dialogo { background: var(--superficie); color: var(--texto); max-width: 540px; width: 100%; padding: 20px 22px; border-top: 5px solid var(--oro); box-shadow: 0 18px 50px rgba(5,9,30,.55); max-height: 90vh; overflow: auto; }
.dialogo h2 { font-size: 1.35rem; margin-bottom: 10px; }
.dlg-cuerpo p { margin: 0 0 10px; }
.dlg-cuerpo fieldset { border: 1px solid var(--linea); margin: 0 0 6px; padding: 8px 12px; }
.dlg-cuerpo label { display: block; margin: 4px 0; cursor: pointer; }
.dlg-cuerpo .sub { margin-left: 24px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.dlg-acciones { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

@media (max-width: 720px) {
  main { padding: 14px 10px 60px; }
  .cabecera { padding: 12px 12px 10px; }
  .herramientas { margin-left: 0; }
  .guardado { flex: 1 0 100%; width: auto; text-align: left; margin-right: 0; }
  .encabezado-vista h2 { font-size: 1.6rem; }
  .hoja .c-esc, .hoja.fija .c-esc { min-width: 120px; }
  .estado-nivel { min-height: 2.9em; }
  .pista { gap: 3px; }
  .pista li { width: 25px; height: 25px; font-size: .86rem; }
  .pista li.receso { padding: 0 2px; }
}
@media (prefers-reduced-motion: no-preference) {
  .globo { animation: entra .18s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media print {
  :root, [data-tema="noche"] {
    --papel: #FFFFFF; --superficie: #FFFFFF; --marca: #17235A; --titulo: #000000; --texto: #000000; --texto-suave: #333333;
    --linea: #999999; --linea-fuerte: #555555; --cab-tabla: #EEEEEE; --fila-alt: #FFFFFF; --oro: #C9962B; --oro-suave: #FFFFFF;
    --alerta: #8A1C16; --alerta-suave: #FFFFFF; --plata: #C8CDD8; --bronce: #C99A78; --sobre-bronce: #000000;
  }
  .herramientas, .pestanas, .no-imprimir, .avisos, .btn, .btn-texto, .ayuda, #capa-dialogo { display: none !important; }
  body { font-size: 10.5pt; }
  .cabecera { background: none; color: #000000; border-bottom: 2px solid #000000; padding: 0 0 6px; }
  .cabecera h1 { color: #000000; }
  main { padding: 10px 0 0; max-width: none; }
  .tabla-desliz { overflow: visible; border: 0; }
  .hoja tbody th.c-mesa, .hoja thead th.c-mesa { position: static; }
  .captura tbody th, .captura tbody td { height: 26px; }
  .captura td.c-p input { height: 25px; }
  .bloque { break-inside: avoid-page; }
  details.bloque:not([open]) { display: none; }
  .pista li.hecha { color: #000000; background: #DDDDDD; border-color: #000000; }
  .tabla-desliz.ajustada { width: auto; }
  .pos { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<noscript><p style="padding:20px">Esta página requiere JavaScript.</p></noscript>
<div id="marco"></div>
<main id="vista"></main>
<div id="avisos" class="avisos" role="status" aria-live="polite"></div>
<div id="capa-dialogo" hidden></div>
<input type="file" id="archivo-respaldo" accept=".json,application/json" hidden>
<script>
(function () {
'use strict';

/* <LOGICA> */
const NIVELES = [
  { id: 'elemental', nombre: 'Elemental' },
  { id: 'intermedia', nombre: 'Intermedia' },
  { id: 'superior', nombre: 'Superior' }
];
const N_PROB = 10;     // problemas de la competencia regular (regla 8)
const MAX_PTS = 10;    // puntuación máxima por problema (regla 8)
const PREMIADAS = 5;   // posiciones premiadas (regla 24)
const ESTADOS_APELACION = ['', 'pendiente', 'aceptada', 'denegada'];
const TEXTO_APELACION = { '': 'Sin apelación', pendiente: 'Pendiente', aceptada: 'Aceptada', denegada: 'Denegada' };

let contadorId = 0;
function nuevoId(prefijo) {
  contadorId += 1;
  return prefijo + Date.now().toString(36) + contadorId.toString(36) + Math.random().toString(36).slice(2, 6);
}

function normalizarNombre(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}
function limpiarNombre(s) {
  return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 120);
}
function esPunto(v) {
  return Number.isInteger(v) && v >= 0 && v <= MAX_PTS;
}
// '' -> null (sin calificar); entero de 0 a MAX_PTS -> número; cualquier otro texto -> undefined
function leerPunto(texto) {
  const t = String(texto == null ? '' : texto).trim();
  if (t === '') return null;
  if (!/^\d{1,2}$/.test(t)) return undefined;
  const n = parseInt(t, 10);
  return n <= MAX_PTS ? n : undefined;
}

function nuevaMesa(numero) {
  const p = [];
  for (let j = 0; j < N_PROB; j++) p.push(null);
  return { id: nuevoId('m'), numero: numero, escuelaId: null, p: p, d: [null, null], dj: null, dgs: [null, null, null], dq: false, ap: ['', ''], obs: '' };
}
function estadoInicial() {
  return { v: 1, evento: 'Grupo MATHCOM PR', escuelas: [], niveles: { elemental: { mesas: [] }, intermedia: { mesas: [] }, superior: { mesas: [] } } };
}

// Orden alfabético sin distinguir mayúsculas ni tildes, con los números en orden numérico.
function compararNombres(a, b) {
  const x = normalizarNombre(a).match(/\d+|\D+/g) || [];
  const y = normalizarNombre(b).match(/\d+|\D+/g) || [];
  for (let i = 0; i < x.length && i < y.length; i++) {
    const nx = /^\d/.test(x[i]);
    const ny = /^\d/.test(y[i]);
    if (nx && ny) {
      const d = parseInt(x[i], 10) - parseInt(y[i], 10);
      if (d) return d;
    } else if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
  }
  return x.length - y.length || (String(a) < String(b) ? -1 : (String(a) > String(b) ? 1 : 0));
}

// Las escuelas se guardan siempre en el mismo orden (por identificador) para que dos equipos que aplican
// los mismos cambios obtengan exactamente el mismo estado.
function ordenarEscuelas(estado) {
  estado.escuelas.sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
}

// Devuelve una mesa válida a partir de un objeto cualquiera (número 0 si no trae uno admisible); null si no es un objeto.
function mesaSaneada(x, idEscuela) {
  if (!x || typeof x !== 'object') return null;
  const numero = parseInt(x.numero, 10);
  const m = nuevaMesa(numero >= 1 && numero <= 9999 ? numero : 0);
  if (typeof x.id === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(x.id)) m.id = x.id;
  m.escuelaId = idEscuela(x.escuelaId);
  if (Array.isArray(x.p)) for (let j = 0; j < N_PROB; j++) m.p[j] = esPunto(x.p[j]) ? x.p[j] : null;
  if (Array.isArray(x.d)) for (let j = 0; j < 2; j++) m.d[j] = esPunto(x.d[j]) ? x.d[j] : null;
  m.dj = Number.isInteger(x.dj) && x.dj >= 1 && x.dj <= 99 ? x.dj : null;
  if (Array.isArray(x.dgs)) for (let j = 0; j < 3; j++) m.dgs[j] = typeof x.dgs[j] === 'string' ? x.dgs[j].slice(0, 6000) : null;
  m.dq = !!x.dq;
  if (Array.isArray(x.ap)) for (let j = 0; j < 2; j++) m.ap[j] = ESTADOS_APELACION.indexOf(x.ap[j]) >= 0 ? x.ap[j] : '';
  m.obs = typeof x.obs === 'string' ? x.obs.slice(0, 300) : '';
  return m;
}

// Devuelve un estado válido a partir de un objeto leído del almacenamiento, de un archivo o del servicio; null si no es reconocible.
function sanear(obj) {
  if (!obj || typeof obj !== 'object' || !obj.niveles || typeof obj.niveles !== 'object') return null;
  const e = estadoInicial();
  if (typeof obj.evento === 'string' && limpiarNombre(obj.evento)) e.evento = limpiarNombre(obj.evento);
  const mapaIds = new Map();
  const porNombre = new Map();
  const idsUsados = new Set();
  (Array.isArray(obj.escuelas) ? obj.escuelas : []).slice(0, 600).forEach(function (x) {
    if (!x || typeof x !== 'object') return;
    const nombre = limpiarNombre(x.nombre);
    if (!nombre) return;
    const clave = normalizarNombre(nombre);
    const idOrigen = typeof x.id === 'string' && x.id && x.id.length <= 60 ? x.id : '';
    const existente = porNombre.get(clave);
    if (existente) {
      if (x.descalificada) existente.descalificada = true;
      if (idOrigen && !mapaIds.has(idOrigen)) mapaIds.set(idOrigen, existente.id);
      return;
    }
    let id = idOrigen;
    if (!id || idsUsados.has(id)) id = nuevoId('e');
    else mapaIds.set(idOrigen, id);
    idsUsados.add(id);
    const escuela = { id: id, nombre: nombre, descalificada: !!x.descalificada };
    e.escuelas.push(escuela);
    porNombre.set(clave, escuela);
  });
  const idEscuela = function (id) { return mapaIds.has(id) ? mapaIds.get(id) : null; };
  NIVELES.forEach(function (nv) {
    const origen = obj.niveles[nv.id];
    const lista = origen && Array.isArray(origen.mesas) ? origen.mesas.slice(0, 300) : [];
    const mesas = [];
    let mayor = 0;
    lista.forEach(function (x) {
      const m = mesaSaneada(x, idEscuela);
      if (!m) return;
      mesas.push(m);
      if (m.numero > mayor) mayor = m.numero;
    });
    const numeros = new Set();
    const ids = new Set();
    mesas.forEach(function (m) {
      if (!m.numero || numeros.has(m.numero)) { mayor += 1; m.numero = mayor; }
      numeros.add(m.numero);
      if (ids.has(m.id)) m.id = nuevoId('m');
      ids.add(m.id);
      e.niveles[nv.id].mesas.push(m);
    });
    e.niveles[nv.id].mesas.sort(function (a, b) { return a.numero - b.numero; });
  });
  ordenarEscuelas(e);
  return e;
}

function sumaHasta(p, k) {
  let s = 0;
  for (let j = 0; j < k; j++) s += p[j] || 0;
  return s;
}
// Número de rondas calificadas para todas las mesas indicadas (consecutivas desde la primera).
function rondasCompletas(mesas) {
  if (!mesas.length) return 0;
  let k = 0;
  while (k < N_PROB && mesas.every(function (m) { return m.p[k] != null; })) k += 1;
  return k;
}
// Regla 23: comparación desde el Problema 10 hacia atrás. dif > 0 si b supera a a.
function compararProblemas(a, b) {
  for (let j = N_PROB - 1; j >= 0; j--) {
    if (a.p[j] !== b.p[j]) return { dif: b.p[j] - a.p[j], problema: j + 1 };
  }
  return { dif: 0, problema: 0 };
}
function porNumero(a, b) { return a.mesa.numero - b.mesa.numero; }
function firmaIds(filas) {
  return filas.map(function (f) { return f.mesa.id; }).sort().join(',');
}
function numerosDe(filas) {
  return filas.map(function (f) { return f.mesa.numero; }).sort(function (a, b) { return a - b; });
}

// Resuelve un grupo de mesas con el mismo total, a partir de la posición `inicio`.
// etapa 1: primera ronda de desempate; 2: segunda ronda; 3: regla 23; 4: empate total.
// Las rondas de desempate solo se aplican si el empate afecta posiciones premiadas.
// Cada puntuación de desempate queda ligada a la composición del grupo para el que se registró (firma):
// si el grupo cambia, la puntuación anterior deja de considerarse.
function resolverEmpate(grupo, inicio, etapa, g, firmaPadre) {
  if (grupo.length === 1) { grupo[0].pos = inicio; return; }
  const premiado = inicio <= PREMIADAS;
  if (etapa <= 2 && !premiado) etapa = 3;

  if (etapa <= 2) {
    const idx = etapa - 1;
    const firma = (etapa === 1 ? 'D1|' + g.total : 'D2|' + firmaPadre) + '|' + firmaIds(grupo);
    grupo.forEach(function (f) {
      const v = f.mesa.dgs[idx] === firma && esPunto(f.mesa.d[idx]) ? f.mesa.d[idx] : null;
      if (etapa === 1) { f.pideD1 = true; f.sig1 = firma; f.d1 = v; }
      else { f.pideD2 = true; f.sig2 = firma; f.d2 = v; }
    });
    const valor = function (f) { return etapa === 1 ? f.d1 : f.d2; };
    if (grupo.some(function (f) { return valor(f) == null; })) {
      grupo.forEach(function (f) { f.pos = inicio; f.empate = true; f.pendiente = etapa; f.criterio = 'pendiente' + etapa; });
      g.pendientes.push({ etapa: etapa, inicio: inicio, filas: grupo.slice().sort(porNumero) });
      return;
    }
    const orden = grupo.slice().sort(function (a, b) { return valor(b) - valor(a) || porNumero(a, b); });
    let i = 0;
    let pos = inicio;
    while (i < orden.length) {
      let j = i;
      while (j < orden.length && valor(orden[j]) === valor(orden[i])) j += 1;
      const sub = orden.slice(i, j);
      if (sub.length === 1) { sub[0].pos = pos; sub[0].criterio = 'd' + etapa; }
      else resolverEmpate(sub, pos, etapa + 1, g, firma + '=' + valor(sub[0]));
      pos += sub.length;
      i = j;
    }
    return;
  }

  if (etapa === 3) {
    const orden = grupo.slice().sort(function (a, b) { return compararProblemas(a.mesa, b.mesa).dif || porNumero(a, b); });
    const tramos = [];
    orden.forEach(function (f) {
      const ultimo = tramos[tramos.length - 1];
      if (ultimo && compararProblemas(ultimo[0].mesa, f.mesa).dif === 0) ultimo.push(f);
      else tramos.push([f]);
    });
    let pos = inicio;
    tramos.forEach(function (tramo, t) {
      if (tramos.length > 1) {
        const vecino = t > 0 ? tramos[t - 1][0] : tramos[1][0];
        const c = compararProblemas(tramo[0].mesa, vecino.mesa);
        tramo.forEach(function (f) { f.problemaDecisivo = c.problema; });
        if (t > 0) {
          g.notas.push({
            arriba: numerosDe(tramos[t - 1]), abajo: numerosDe(tramo), problema: c.problema,
            ptsArriba: tramos[t - 1][0].mesa.p[c.problema - 1], ptsAbajo: tramo[0].mesa.p[c.problema - 1]
          });
        }
      }
      if (tramo.length === 1) { tramo[0].pos = pos; tramo[0].criterio = 'r23'; }
      else resolverEmpate(tramo, pos, 4, g, firmaPadre);
      pos += tramo.length;
    });
    return;
  }

  // Etapa 4: puntuaciones idénticas en los diez problemas (y en los desempates, si los hubo).
  if (!premiado) {
    grupo.forEach(function (f) { f.pos = inicio; f.empate = true; f.criterio = 'igual'; });
    return;
  }
  const firmaJ = 'DJ|' + g.total + '|' + grupo[0].mesa.p.join('.') + '|' + firmaPadre + '|' + firmaIds(grupo);
  grupo.forEach(function (f) {
    f.pideDJ = true;
    f.sigJ = firmaJ;
    f.dj = f.mesa.dgs[2] === firmaJ && Number.isInteger(f.mesa.dj) ? f.mesa.dj : null;
  });
  if (grupo.some(function (f) { return f.dj == null; })) {
    grupo.forEach(function (f) { f.pos = inicio; f.empate = true; f.criterio = 'igual'; });
    g.sinResolver.push({ inicio: inicio, filas: grupo.slice().sort(porNumero) });
    return;
  }
  const ordenJ = grupo.slice().sort(function (a, b) { return a.dj - b.dj || porNumero(a, b); });
  let i = 0;
  let pos = inicio;
  while (i < ordenJ.length) {
    let j = i;
    while (j < ordenJ.length && ordenJ[j].dj === ordenJ[i].dj) j += 1;
    const sub = ordenJ.slice(i, j);
    sub.forEach(function (f) { f.pos = pos; f.criterio = 'jueces'; f.empate = sub.length > 1; });
    pos += sub.length;
    i = j;
  }
}

function clasificarNivel(estado, nivelId) {
  const mesas = estado.niveles[nivelId].mesas;
  const mapaEsc = new Map(estado.escuelas.map(function (e) { return [e.id, e]; }));
  const filas = mesas.map(function (m) {
    const esc = m.escuelaId ? mapaEsc.get(m.escuelaId) || null : null;
    const dqEscuela = !!(esc && esc.descalificada);
    return {
      mesa: m, escuela: esc, dqEscuela: dqEscuela, activa: !m.dq && !dqEscuela,
      totalVivo: sumaHasta(m.p, N_PROB), calificadas: m.p.filter(function (v) { return v != null; }).length,
      total: 0, pos: null, empate: false, criterio: '', pendiente: 0, problemaDecisivo: 0,
      d1: null, d2: null, dj: null, sig1: '', sig2: '', sigJ: '', pideD1: false, pideD2: false, pideDJ: false
    };
  });
  const activas = filas.filter(function (f) { return f.activa; });
  const k = rondasCompletas(activas.map(function (f) { return f.mesa; }));
  filas.forEach(function (f) { f.total = sumaHasta(f.mesa.p, k); });
  const res = {
    nivelId: nivelId, k: k, filas: filas, orden: [], nMesas: filas.length, nActivas: activas.length,
    grupos: [], faltantes: null, adelantadas: false, estado: 'vacio', hayPremiado: false, sinResolver: false, apelacionesPendientes: 0
  };

  if (activas.length && k < N_PROB) {
    const sin = activas.filter(function (f) { return f.mesa.p[k] == null; });
    res.faltantes = { ronda: k + 1, mesas: numerosDe(sin), calificadas: activas.length - sin.length };
    res.adelantadas = activas.some(function (f) { return f.mesa.p.some(function (v, j) { return j > k && v != null; }); });
  }

  if (k > 0) {
    const orden = activas.slice().sort(function (a, b) { return b.total - a.total || porNumero(a, b); });
    let i = 0;
    while (i < orden.length) {
      let j = i;
      while (j < orden.length && orden[j].total === orden[i].total) j += 1;
      const grupo = orden.slice(i, j);
      const inicio = i + 1;
      if (grupo.length === 1) grupo[0].pos = inicio;
      else if (k < N_PROB) grupo.forEach(function (f) { f.pos = inicio; f.empate = true; });
      else {
        const g = { inicio: inicio, total: grupo[0].total, filas: grupo.slice().sort(porNumero), premiado: inicio <= PREMIADAS, pendientes: [], notas: [], sinResolver: [] };
        res.grupos.push(g);
        resolverEmpate(grupo, inicio, 1, g, '');
      }
      i = j;
    }
  }

  const inactivas = filas.filter(function (f) { return !f.activa; }).sort(porNumero);
  res.orden = activas.slice().sort(function (a, b) {
    const pa = a.pos == null ? Infinity : a.pos;
    const pb = b.pos == null ? Infinity : b.pos;
    return (pa === pb ? 0 : pa - pb) || porNumero(a, b);
  }).concat(inactivas);

  res.hayPremiado = res.grupos.some(function (g) { return g.premiado; });
  res.sinResolver = res.grupos.some(function (g) { return g.sinResolver.length > 0; });
  res.apelacionesPendientes = filas.reduce(function (n, f) { return n + f.mesa.ap.filter(function (a) { return a === 'pendiente'; }).length; }, 0);
  const pendiente = res.grupos.some(function (g) { return g.pendientes.length > 0; });
  if (!filas.length) res.estado = 'vacio';
  else if (!activas.length) res.estado = 'sin-activas';
  else if (k < N_PROB) res.estado = activas.some(function (f) { return f.calificadas > 0; }) ? 'en-curso' : 'sin-iniciar';
  else res.estado = pendiente ? 'desempate' : 'final';
  return res;
}

function criterioTexto(f) {
  switch (f.criterio) {
    case 'pendiente1': return 'Desempate 1 pendiente';
    case 'pendiente2': return 'Desempate 2 pendiente';
    case 'd1': return 'Desempate 1';
    case 'd2': return 'Desempate 2';
    case 'r23': return 'Regla 23 (Problema ' + f.problemaDecisivo + ')';
    case 'jueces': return 'Determinación de los jueces';
    case 'igual': return 'Empate total';
    default: return '';
  }
}

// Copa: suma de los totales de las mesas activas de cada escuela en los tres niveles.
// Las escuelas con el mismo total comparten posición y la siguiente recibe el número consecutivo.
function clasificarCopa(estado, clasPorNivel) {
  const clas = clasPorNivel || {};
  NIVELES.forEach(function (nv) { if (!clas[nv.id]) clas[nv.id] = clasificarNivel(estado, nv.id); });
  const acumulado = new Map();
  let sinEscuela = 0;
  NIVELES.forEach(function (nv) {
    clas[nv.id].filas.forEach(function (f) {
      if (!f.escuela) { if (f.activa) sinEscuela += 1; return; }
      let a = acumulado.get(f.escuela.id);
      if (!a) {
        a = { escuela: f.escuela, porNivel: { elemental: 0, intermedia: 0, superior: 0 }, mesasNivel: { elemental: 0, intermedia: 0, superior: 0 }, total: 0, mesas: 0, mesasDq: 0, pos: null, empate: false };
        acumulado.set(f.escuela.id, a);
      }
      a.mesas += 1;
      a.mesasNivel[nv.id] += 1;
      if (f.activa) { a.porNivel[nv.id] += f.total; a.total += f.total; }
      else if (!f.dqEscuela) a.mesasDq += 1;
    });
  });
  const porNombre = function (a, b) { return compararNombres(a.escuela.nombre, b.escuela.nombre); };
  const lista = Array.from(acumulado.values());
  const activas = lista.filter(function (a) { return !a.escuela.descalificada; }).sort(function (a, b) { return b.total - a.total || porNombre(a, b); });
  const hayDatos = NIVELES.some(function (nv) { return clas[nv.id].k > 0; });
  if (hayDatos) {
    let pos = 0;
    let previo = null;
    activas.forEach(function (a) {
      if (previo === null || a.total !== previo) { pos += 1; previo = a.total; }
      a.pos = pos;
    });
    activas.forEach(function (a) { a.empate = activas.filter(function (b) { return b.pos === a.pos; }).length > 1; });
  }
  const descalificadas = lista.filter(function (a) { return a.escuela.descalificada; }).sort(porNombre);
  const provisional = NIVELES.some(function (nv) { const c = clas[nv.id]; return c.nActivas > 0 && c.k < N_PROB; });
  const apelaciones = NIVELES.reduce(function (n, nv) { return n + clas[nv.id].apelacionesPendientes; }, 0);
  return { filas: activas.concat(descalificadas), sinEscuela: sinEscuela, provisional: provisional, hayDatos: hayDatos, apelaciones: apelaciones };
}

// Sustituye en `actual` los niveles indicados por los de `importado`; las escuelas se emparejan por nombre.
function incorporarNiveles(actual, importado, ids) {
  const res = sanear(JSON.parse(JSON.stringify(actual)));
  const mapa = new Map();
  const porNombre = new Map(res.escuelas.map(function (e) { return [normalizarNombre(e.nombre), e]; }));
  function idLocal(idImportado) {
    if (!idImportado) return null;
    if (mapa.has(idImportado)) return mapa.get(idImportado);
    const origen = importado.escuelas.find(function (e) { return e.id === idImportado; });
    if (!origen) return null;
    const clave = normalizarNombre(origen.nombre);
    let destino = porNombre.get(clave);
    if (!destino) {
      destino = { id: nuevoId('e'), nombre: origen.nombre, descalificada: !!origen.descalificada };
      res.escuelas.push(destino);
      porNombre.set(clave, destino);
    } else if (origen.descalificada) destino.descalificada = true;
    mapa.set(idImportado, destino.id);
    return destino.id;
  }
  ids.forEach(function (nid) {
    if (!res.niveles[nid] || !importado.niveles[nid]) return;
    res.niveles[nid].mesas = importado.niveles[nid].mesas.map(function (m) {
      const copia = JSON.parse(JSON.stringify(m));
      copia.escuelaId = idLocal(m.escuelaId);
      return copia;
    });
  });
  ordenarEscuelas(res);
  return res;
}

function matrizNivel(estado, nivelId) {
  const c = clasificarNivel(estado, nivelId);
  const cab = ['Posición', 'Mesa', 'Escuela'];
  for (let j = 0; j < N_PROB; j++) cab.push('P' + (j + 1));
  cab.push('Total', 'Desempate 1', 'Desempate 2', 'Criterio de desempate', 'Estado', 'Apelación (problemas 1 a 5)', 'Apelación (problemas 6 a 10)', 'Observaciones', 'Rondas completas');
  const filas = [cab];
  c.orden.forEach(function (f) {
    const m = f.mesa;
    const fila = [f.activa && f.pos != null ? f.pos : '', m.numero, f.escuela ? f.escuela.nombre : ''];
    for (let j = 0; j < N_PROB; j++) fila.push(m.p[j] == null ? '' : m.p[j]);
    fila.push(f.total, f.d1 == null ? '' : f.d1, f.d2 == null ? '' : f.d2, criterioTexto(f),
      f.activa ? 'Activa' : (f.dqEscuela ? 'Escuela descalificada' : 'Descalificada'),
      TEXTO_APELACION[m.ap[0]], TEXTO_APELACION[m.ap[1]], m.obs, c.k);
    filas.push(fila);
  });
  return filas;
}
function matrizCopa(estado) {
  const copa = clasificarCopa(estado);
  const filas = [['Posición', 'Escuela', 'Elemental', 'Intermedia', 'Superior', 'Total', 'Mesas', 'Estado']];
  copa.filas.forEach(function (a) {
    const dq = a.escuela.descalificada;
    filas.push([dq || a.pos == null ? '' : a.pos, a.escuela.nombre,
      dq ? '' : a.porNivel.elemental, dq ? '' : a.porNivel.intermedia, dq ? '' : a.porNivel.superior, dq ? '' : a.total,
      a.mesas, dq ? 'Descalificada' : 'Activa']);
  });
  return filas;
}
// Un texto que comienza con =, +, - o @ se antepone con un apóstrofo para que una hoja de cálculo no lo tome por fórmula.
function textoSeguro(s) {
  return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
}
function celdaCsv(v) {
  const s = v == null ? '' : (typeof v === 'string' ? textoSeguro(v) : String(v));
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function aCsv(matriz) {
  return '﻿' + matriz.map(function (fila) { return fila.map(celdaCsv).join(','); }).join('\r\n') + '\r\n';
}
function csvNivel(estado, nivelId) { return aCsv(matrizNivel(estado, nivelId)); }
function csvCopa(estado) { return aCsv(matrizCopa(estado)); }

// ---- Operaciones ----
// Todo cambio de los datos es una operación con forma {t: tipo, ...}. La misma función la aplica en la página y en el
// servicio de sincronización. Devuelve la lista de operaciones que deshacen el cambio (vacía si no hubo cambio).
function aplicarOp(estado, op) {
  if (!op || typeof op !== 'object') return [];
  const nivel = typeof op.n === 'string' && Object.prototype.hasOwnProperty.call(estado.niveles, op.n) ? estado.niveles[op.n] : null;
  const mesa = nivel && typeof op.id === 'string' ? nivel.mesas.find(function (m) { return m.id === op.id; }) || null : null;
  const escuela = function (id) { return typeof id === 'string' ? estado.escuelas.find(function (e) { return e.id === id; }) || null : null; };
  const escuelaLlamada = function (nombre) {
    const clave = normalizarNombre(nombre);
    return estado.escuelas.find(function (e) { return normalizarNombre(e.nombre) === clave; }) || null;
  };
  switch (op.t) {
    case 'punto': {
      if (!mesa || !Number.isInteger(op.c) || op.c < 0 || op.c >= N_PROB) return [];
      const v = op.v == null ? null : op.v;
      if (v !== null && !esPunto(v)) return [];
      const previo = mesa.p[op.c];
      if (previo === v) return [];

/* ---------- Actualización del documento sin reemplazar los nodos existentes ---------- */
function claveNodo(n) {
  return n.nodeType === 1 ? (n.getAttribute('data-k') || '') + '#' + (n.id || '') : '';
}
function mismaClase(a, b) {
  if (a.nodeType !== b.nodeType) return false;

  return a.tagName === b.tagName && claveNodo(a) === claveNodo(b);
}

  const enUso = esCampo && a === document.activeElement;
  const omitir = function (nombre) {
    return (nombre === 'open' && a.tagName === 'DETAILS') || (enUso && (nombre === 'value' || nombre === 'class'));
  };
  for (let i = a.attributes.length - 1; i >= 0; i--) {
    const nombre = a.attributes[i].name;
    if (!b.hasAttribute(nombre) && !omitir(nombre)) a.removeAttribute(nombre);
  }
  for (let i = 0; i < b.attributes.length; i++) {
    const nombre = b.attributes[i].name;
    const valor = b.attributes[i].value;
    if (!omitir(nombre) && a.getAttribute(nombre) !== valor) a.setAttribute(nombre, valor);
  }
  if (a.tagName !== 'TEXTAREA') morphHijos(a, b);

    if (a.tagName === 'INPUT') {
      if (a.type === 'checkbox' || a.type === 'radio') {
        const marcado = b.hasAttribute('checked');
        if (a.checked !== marcado) a.checked = marcado;
      } else if (a.type !== 'file') {
        const v = b.getAttribute('value') || '';
        if (a.value !== v) a.value = v;
      }
    } else if (a.tagName === 'SELECT') {
      const op = b.querySelector('option[selected]');

function morphHijos(a, b) {

      ca = ca.nextSibling;
    } else {

      if (cb.nodeType === 1 && claveNodo(cb) !== '#') {

        while (ca !== hallado) {
          const sigA = ca.nextSibling;

          ca = sigA;

        a.insertBefore(hallado, ca);

        ca = sigA;

    ca = sigA;
  }

// Devuelve una promesa: null si se cancela; en caso contrario, true o el valor de opc.leer(dialogo).
function dialogo(opc) {
  return new Promise(function (resolver) {
    const capa = document.getElementById('capa-dialogo');
    const previo = document.activeElement;
    capa.innerHTML = '<div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dlg-titulo">' +
      '<h2 id="dlg-titulo">' + esc(opc.titulo) + '</h2><div class="dlg-cuerpo">' + opc.cuerpoHtml + '</div>' +
      '<div class="dlg-acciones"><button type="button" class="btn" data-dlg="cancelar">' + esc(opc.cancelar || 'Cancelar') + '</button>' +
      '<button type="button" class="btn ' + (opc.peligro ? 'peligro-lleno' : 'primario') + '" data-dlg="aceptar">' + esc(opc.aceptar || 'Aceptar') + '</button></div></div>';
    capa.hidden = false;
    const cerrar = function (aceptado) {
      const dlg = capa.firstElementChild;
      let valor = null;
      if (aceptado) {
        valor = opc.leer ? opc.leer(dlg) : true;
        if (valor === undefined) return;
      }
      capa.hidden = true;
      capa.innerHTML = '';
      capa.onclick = null;
      capa.onkeydown = null;
      if (previo && previo.focus && document.contains(previo)) previo.focus();
      resolver(valor);
    };
    capa.onclick = function (ev) {
      const b = ev.target.closest('[data-dlg]');
      if (b) cerrar(b.dataset.dlg === 'aceptar');
      else if (ev.target === capa) cerrar(false);
    };
    capa.onkeydown = function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); cerrar(false); return; }
      if (ev.key !== 'Tab') return;
      const focos = Array.from(capa.querySelectorAll('button, input, select')).filter(function (x) { return !x.disabled; });
      if (!focos.length) return;
      const primero = focos[0];
      const ultimo = focos[focos.length - 1];
      if (ev.shiftKey && document.activeElement === primero) { ev.preventDefault(); ultimo.focus(); }
      else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primero.focus(); }
    };
    capa.querySelector('[data-dlg="cancelar"]').focus();
  });
}

      '<th scope="col" title="Mesas en el nivel Elemental">Elemental</th><th scope="col" title="Mesas en el nivel Intermedia">Intermedia</th><th scope="col" title="Mesas en el nivel Superior">Superior</th>' +
      '<th scope="col">Descalificada</th><th scope="col"><span class="tenue">Acción</span></th></tr></thead><tbody>' + filasEsc + '</tbody></table></div>'
    : '<p class="vacio">No hay escuelas registradas.</p>';

  const niveles = NIVELES.map(function (nv) {
    const mesas = estado.niveles[nv.id].mesas;
    const filas = mesas.map(function (m) {
      const e = m.escuelaId ? escuelaPorId(m.escuelaId) : null;
      return '<tr data-k="' + esc(m.id) + '">' +
        '<td><input type="text" inputmode="numeric" maxlength="4" class="campo num" aria-label="Número de la mesa ' + m.numero + '" data-acc="mesa-numero" data-n="' + nv.id + '" data-id="' + esc(m.id) + '" value="' + m.numero + '"></td>' +
        '<td class="col-escuela c-esc"><input type="text" class="campo" list="lista-escuelas" maxlength="120" placeholder="Sin asignar" aria-label="Escuela de la mesa ' + m.numero + '" data-acc="mesa-escuela" data-n="' + nv.id + '" data-id="' + esc(m.id) + '" value="' + (e ? esc(e.nombre) : '') + '"></td>' +
        '<td><button type="button" class="btn-texto" data-acc="del-mesa" data-n="' + nv.id + '" data-id="' + esc(m.id) + '" aria-label="Eliminar la mesa ' + m.numero + ' del nivel ' + nv.nombre + '">Eliminar</button></td></tr>';
    }).join('');
    return '<section class="bloque" data-k="cfg-' + nv.id + '">' +
      '<h3>' + nv.nombre + '<span class="cuenta">' + mesas.length + ' ' + plural(mesas.length, 'mesa', 'mesas') + '</span></h3>' +
      '<div class="acciones"><label class="etiqueta-campo">Cantidad <input type="number" class="campo num" id="cantidad-' + nv.id + '" data-libre min="1" max="100" value="1"></label>' +
      '<button type="button" class="btn" data-acc="add-mesas" data-n="' + nv.id + '">Añadir mesas</button></div>' +
      (mesas.length
        ? '<div class="tabla-desliz"><table class="hoja"><thead><tr><th scope="col">Mesa</th><th scope="col" class="col-escuela c-esc">Escuela</th><th scope="col"><span class="tenue">Acción</span></th></tr></thead><tbody>' + filas + '</tbody></table></div>'
        : '<p class="vacio">Sin mesas registradas.</p>') +
      '</section>';
  }).join('');

  return '<div class="vista" data-k="v-config">' +
    '<div class="encabezado-vista"><h2>Mesas y escuelas</h2></div>' +
    '<p class="aviso-linea solo-oculto">Las escuelas están ocultas. Para registrarlas o asignarlas a las mesas, desactive «Ocultar escuelas».</p>' +
    '<section class="bloque" data-k="cfg-evento"><h3>Evento</h3>' +
    '<label class="etiqueta-campo larga">Nombre del evento <input type="text" class="campo ancho" maxlength="120" data-acc="evento" value="' + esc(estado.evento) + '"></label></section>' +
    '<p class="ayuda nota-niveles solo-visible">La escuela de cada mesa se escribe en su fila; un nombre nuevo queda registrado automáticamente.</p>' +
    '<div class="rejilla-niveles">' + niveles + '</div>' +
    '<section class="bloque panel-escuelas solo-visible" data-k="cfg-escuelas"><h3>Registro de escuelas<span class="cuenta">' + escuelas.length + ' ' + plural(escuelas.length, 'registrada', 'registradas') + '</span></h3>' +
    '<p class="ayuda">Desde aquí se registran escuelas por adelantado, se corrigen nombres y se descalifica una escuela. Al cambiar un nombre por el de otra escuela registrada, ambas se combinan.</p>' +
    '<div class="acciones"><input type="text" class="campo ancho" id="nueva-escuela" data-libre maxlength="120" placeholder="Nombre de la escuela" aria-label="Nombre de la escuela nueva">' +
    '<button type="button" class="btn" data-acc="add-escuela">Añadir escuela</button></div>' + tablaEsc + '</section>' +
    '<datalist id="lista-escuelas">' + escuelas.map(function (e) { return '<option value="' + esc(e.nombre) + '"></option>'; }).join('') + '</datalist>' +
    '</div>';
}

/* ---------- Vista: nivel ---------- */
function pistaRondas(c) {
  let items = '';
  for (let i = 1; i <= N_PROB; i++) {
    const cls = i <= c.k ? 'hecha' : (i === c.k + 1 && c.nActivas ? 'actual' : '');
    if (i === 6) items += '<li class="receso" aria-hidden="true">receso</li>';
    items += '<li' + (cls ? ' class="' + cls + '"' : '') + '>' + i + '</li>';
  }
  return '<ol class="pista" aria-label="Rondas completadas: ' + c.k + ' de ' + N_PROB + '">' + items + '</ol>';
}
function seccionCaptura(nv, c) {
  let cab = '';
  for (let j = 0; j < N_PROB; j++) {
    const cls = j < c.k ? ' hecha' : (j === c.k && c.nActivas ? ' actual' : '');
    cab += '<th scope="col" class="c-p' + cls + (j === 4 ? ' receso' : '') + '" title="Problema ' + (j + 1) + (j < c.k ? ': ronda completa' : '') + '">P' + (j + 1) + '</th>';
  }
  const filas = c.filas.map(function (f, r) {
    const m = f.mesa;
    let celdas = '';
    for (let j = 0; j < N_PROB; j++) {
      celdas += '<td class="c-p' + (j === 4 ? ' receso' : '') + (j >= c.k ? ' pend' : '') + '"><input type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Mesa ' + m.numero + ', problema ' + (j + 1) +
        '" data-acc="punto" data-n="' + nv.id + '" data-id="' + esc(m.id) + '" data-r="' + r + '" data-c="' + j + '" value="' + (m.p[j] == null ? '' : m.p[j]) + '"></td>';
    }
    const apel = m.ap.indexOf('pendiente') >= 0 ? '<span class="marca-ap" title="Apelación pendiente">apelación</span>' : '';
    return '<tr data-k="' + esc(m.id) + '"' + (f.activa ? '' : ' class="fila-dq"') + '>' +
      '<th scope="row" class="c-mesa"><span class="num-mesa">' + m.numero + '</span>' + apel + '</th>' +
      '<td class="col-escuela c-esc">' + nombreEscuela(f) + '</td>' + celdas +
      '<td class="c-total">' + (c.k ? f.total : '<span class="pos-nula">—</span>') + '</td>' +
      '<td class="c-pos">' + etiquetaPos(f) + '</td></tr>';
  }).join('');
  return '<section class="bloque" data-k="captura"><h3>Puntuaciones</h3>' +
    '<p class="ayuda">Puntuaciones enteras de 0 a ' + MAX_PTS + ' por problema. El total y la posición cuentan las rondas calificadas para todas las mesas activas; las puntuaciones de las demás rondas se muestran en gris. La tecla Intro y las flechas desplazan el cursor entre casillas.</p>' +
    '<div class="tabla-desliz ajustada"><table class="hoja fija captura"><thead><tr><th scope="col" class="c-mesa">Mesa</th><th scope="col" class="col-escuela c-esc">Escuela</th>' + cab +
    '<th scope="col" class="c-total" title="' + (c.k ? 'Total tras la ronda ' + c.k : 'Total de las rondas completas') + '">Total</th><th scope="col" class="c-pos" title="' + (c.k ? 'Posición tras la ronda ' + c.k : 'Posición') + '">Posición</th></tr></thead>' +
    '<tbody>' + filas + '</tbody></table></div></section>';
}
function grupoDesempate(nv, g) {
  const hayD2 = g.filas.some(function (f) { return f.pideD2; });
  const hayDJ = g.filas.some(function (f) { return f.pideDJ; });
  const campo = function (f, acc, i, sig, valor, etiqueta) {
    return '<input type="text" inputmode="numeric" maxlength="2" autocomplete="off" class="campo num" aria-label="' + etiqueta + ' de la mesa ' + f.mesa.numero +
      '" data-acc="' + acc + '" data-n="' + nv.id + '" data-id="' + esc(f.mesa.id) + '"' + (i == null ? '' : ' data-i="' + i + '"') + ' data-sig="' + esc(sig) + '" value="' + (valor == null ? '' : valor) + '">';
  };
  const raya = '<span class="tenue">—</span>';
  const filas = g.filas.map(function (f) {
    return '<tr data-k="' + esc(f.mesa.id) + '"><th scope="row" class="c-mesa"><span class="num-mesa">' + f.mesa.numero + '</span></th>' +
      '<td class="col-escuela c-esc">' + nombreEscuela(f) + '</td>' +
      '<td class="c-d">' + (f.pideD1 ? campo(f, 'desempate', 0, f.sig1, f.d1, 'Desempate 1') : raya) + '</td>' +
      (hayD2 ? '<td class="c-d">' + (f.pideD2 ? campo(f, 'desempate', 1, f.sig2, f.d2, 'Desempate 2') : raya) + '</td>' : '') +
      (hayDJ ? '<td class="c-d">' + (f.pideDJ ? campo(f, 'jueces', null, f.sigJ, f.dj, 'Orden asignado por los jueces') : raya) + '</td>' : '') +
      '<td class="c-pos">' + etiquetaPos(f) + '</td><td class="c-crit">' + esc(criterioTexto(f)) + '</td></tr>';
  }).join('');
  const notas = notasDesempate(g);
  const resuelto = !g.pendientes.length && !g.sinResolver.length;
  const fin = g.inicio + g.filas.length - 1;
  return '<div class="grupo" data-k="g-' + g.inicio + '-' + g.total + '">' +
    '<h4>Empate con ' + g.total + ' puntos: posiciones ' + g.inicio + ' a ' + fin + '</h4>' +
    '<div class="tabla-desliz ajustada"><table class="hoja"><thead><tr><th scope="col" class="c-mesa">Mesa</th><th scope="col" class="col-escuela c-esc">Escuela</th>' +
    '<th scope="col">Desempate 1</th>' + (hayD2 ? '<th scope="col">Desempate 2</th>' : '') + (hayDJ ? '<th scope="col">Orden de los jueces</th>' : '') +
    '<th scope="col" class="c-pos">Posición</th><th scope="col" class="c-crit">Criterio</th></tr></thead><tbody>' + filas + '</tbody></table></div>' +
    '<ul>' + (resuelto ? '<li>Empate resuelto.</li>' : '') + notas.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') +
    (hayDJ ? '<li>Orden de los jueces: 1 para la mesa que ocupa la posición superior del grupo, 2 para la siguiente, y así sucesivamente.</li>' : '') + '</ul></div>';
}
function seccionDesempates(nv, c) {
  const grupos = c.grupos.filter(function (g) { return g.premiado; });
  if (!grupos.length) return '';
  return '<section class="bloque" data-k="desempates"><h3>Desempates</h3>' +
    '<p class="ayuda">Las rondas de desempate ordenan a las mesas empatadas en posiciones premiadas; sus puntuaciones, de 0 a ' + MAX_PTS + ', no se suman al total (reglas 22 y 23).</p>' +
    grupos.map(function (g) { return grupoDesempate(nv, g); }).join('') + '</section>';
}
// escuelas: 'no' (sin columna), 'col' (columna sujeta a «Ocultar escuelas») o 'fija' (columna siempre visible)
function tablaResultados(c, o) {
  const filas = o.orden === 'mesa' ? c.filas : c.orden;
  let cab = '<th scope="col" class="c-pos">Posición</th><th scope="col" class="c-mesa">Mesa</th>';
  if (o.escuelas !== 'no') cab += '<th scope="col" class="c-esc' + (o.escuelas === 'col' ? ' col-escuela' : '') + '">Escuela</th>';
  for (let j = 0; j < N_PROB; j++) {
    cab += '<th scope="col" class="c-p' + (j === 4 ? ' receso' : '') + '" title="' + (o.acumulado ? 'Acumulado tras el problema ' : 'Problema ') + (j + 1) + '">' + (o.acumulado ? 'A' : 'P') + (j + 1) + '</th>';
  }
  cab += '<th scope="col" class="c-total">Total</th>';
  if (c.hayPremiado) {
    cab += o.ancho ? '<th scope="col">Desempate 1</th><th scope="col">Desempate 2</th>'
      : '<th scope="col" title="Primera ronda de desempate">D1</th><th scope="col" title="Segunda ronda de desempate">D2</th>';
  }
  if (o.criterio) cab += '<th scope="col" class="c-crit">Criterio de desempate</th>';
  const cuerpo = filas.map(function (f) {
    const m = f.mesa;
    let tds = '';
    let ac = 0;
    for (let j = 0; j < N_PROB; j++) {
      let txt = '';
      if (j < c.k && m.p[j] != null) { ac += m.p[j]; txt = o.acumulado ? ac : m.p[j]; }
      tds += '<td class="c-p' + (j === 4 ? ' receso' : '') + '">' + txt + '</td>';
    }
    const premio = f.activa && f.pos != null && f.pos <= PREMIADAS;
    return '<tr' + (f.activa ? (premio ? ' class="premio"' : '') : ' class="fila-dq"') + '>' +
      '<td class="c-pos">' + etiquetaPos(f) + '</td>' +
      '<th scope="row" class="c-mesa"><span class="num-mesa">' + m.numero + '</span></th>' +
      (o.escuelas !== 'no' ? '<td class="c-esc' + (o.escuelas === 'col' ? ' col-escuela' : '') + '">' + nombreEscuela(f) + '</td>' : '') +
      tds + '<td class="c-total">' + (c.k ? f.total : '<span class="pos-nula">—</span>') + '</td>' +
      (c.hayPremiado ? '<td class="c-d">' + (f.d1 == null ? '' : f.d1) + '</td><td class="c-d">' + (f.d2 == null ? '' : f.d2) + '</td>' : '') +
      (o.criterio ? '<td class="c-crit">' + esc(criterioTexto(f)) + '</td>' : '') + '</tr>';
  }).join('');
  return '<div class="tabla-desliz' + (o.ancho ? '' : ' ajustada') + '"><table class="hoja' + (o.ancho ? '' : ' fija') + '"><thead><tr>' + cab + '</tr></thead><tbody>' + cuerpo + '</tbody></table></div>';
}
function seccionClasificacion(nv, c) {
  let ayuda;
  if (!c.k) ayuda = 'La clasificación se calcula a partir de la primera ronda calificada para todas las mesas activas.';
  else if (c.k < N_PROB) ayuda = 'Clasificación tras la ronda ' + c.k + '. Solo cuentan las rondas calificadas para todas las mesas activas.';
  else if (c.estado === 'desempate') ayuda = 'Clasificación con desempate pendiente.';
  else ayuda = 'Clasificación final.';
  return '<section class="bloque" data-k="clasificacion"><div class="fila-titulo"><h3>Clasificación</h3>' +
    '<label class="interruptor no-imprimir"><input type="checkbox" data-acc="acumulado"' + (ui.acumulado ? ' checked' : '') + '> Mostrar la puntuación acumulada por ronda</label></div>' +
    '<p class="ayuda">' + ayuda + '</p>' +
    (c.k ? tablaResultados(c, { escuelas: 'col', acumulado: ui.acumulado, orden: 'posicion', criterio: true }) : '') + '</section>';
}
function seccionIncidencias(nv, c) {
  const nDq = c.filas.filter(function (f) { return !f.activa; }).length;
  const resumen = [];
  if (c.apelacionesPendientes) resumen.push(c.apelacionesPendientes + ' ' + plural(c.apelacionesPendientes, 'apelación pendiente', 'apelaciones pendientes'));
  if (nDq) resumen.push(nDq + ' ' + plural(nDq, 'mesa descalificada', 'mesas descalificadas'));
  const opciones = function (v) {
    return ESTADOS_APELACION.map(function (e) { return '<option value="' + e + '"' + (e === v ? ' selected' : '') + '>' + TEXTO_APELACION[e] + '</option>'; }).join('');
  };
  const filas = c.filas.map(function (f) {
    const m = f.mesa;
    const comun = ' data-n="' + nv.id + '" data-id="' + esc(m.id) + '"';
    return '<tr data-k="' + esc(m.id) + '"' + (f.activa ? '' : ' class="fila-dq"') + '>' +
      '<th scope="row" class="c-mesa"><span class="num-mesa">' + m.numero + '</span></th>' +
      '<td class="col-escuela c-esc">' + nombreEscuela(f) + '</td>' +
      '<td><select class="campo" aria-label="Apelación de la mesa ' + m.numero + ', problemas 1 a 5" data-acc="apelacion" data-i="0"' + comun + '>' + opciones(m.ap[0]) + '</select></td>' +
      '<td><select class="campo" aria-label="Apelación de la mesa ' + m.numero + ', problemas 6 a 10" data-acc="apelacion" data-i="1"' + comun + '>' + opciones(m.ap[1]) + '</select></td>' +
      '<td>' + (f.dqEscuela ? '<span class="pos-dq">Escuela descalificada</span>'
        : '<input type="checkbox" aria-label="Descalificar la mesa ' + m.numero + '" data-acc="dq-mesa"' + comun + (m.dq ? ' checked' : '') + '>') + '</td>' +
      '<td class="c-obs"><input type="text" class="campo" maxlength="300" aria-label="Observaciones de la mesa ' + m.numero + '" data-acc="obs"' + comun + ' value="' + esc(m.obs) + '"></td></tr>';
  }).join('');
  return '<details class="bloque" data-k="incidencias"' + (resumen.length ? ' open' : '') + '>' +
    '<summary>Apelaciones, descalificaciones y observaciones' + (resumen.length ? '<span class="cuenta">' + resumen.join('; ') + '</span>' : '') + '</summary>' +
    '<p class="ayuda">Cada mesa dispone de una apelación para los problemas 1 a 5 y otra para los problemas 6 a 10 (regla 18). Una mesa descalificada conserva sus puntuaciones, pero queda fuera de la clasificación y de la Copa.</p>' +
    '<div class="tabla-desliz"><table class="hoja"><thead><tr><th scope="col" class="c-mesa">Mesa</th><th scope="col" class="col-escuela c-esc">Escuela</th>' +
    '<th scope="col">Apelación, problemas 1 a 5</th><th scope="col">Apelación, problemas 6 a 10</th><th scope="col">Descalificada</th><th scope="col" class="c-obs">Observaciones</th></tr></thead>' +
    '<tbody>' + filas + '</tbody></table></div></details>';
}
function vistaNivel(nv, c) {
  const cuerpo = c.nMesas
    ? '<p class="estado-nivel">' + textoEstadoNivel(c) + '</p>' + seccionCaptura(nv, c) + seccionDesempates(nv, c) + seccionClasificacion(nv, c) + seccionIncidencias(nv, c)
    : '<p class="vacio">No hay mesas registradas en el nivel ' + nv.nombre + '. <a href="#config" data-tab="config">Registrar mesas y escuelas</a></p>';
  return '<div class="vista" data-k="v-' + nv.id + '">' +
    '<div class="encabezado-vista"><h2>Nivel ' + nv.nombre + '</h2>' + (c.nMesas ? pistaRondas(c) : '') + '</div>' + cuerpo + '</div>';
}

/* ---------- Vista: Copa ---------- */
function tablaCopa(copa) {
  const filas = copa.filas.map(function (a) {
    const dq = a.escuela.descalificada;
    const nivel = function (id) { return !dq && a.mesasNivel[id] ? a.porNivel[id] : '<span class="tenue">—</span>'; };
    let pos;
    if (dq) pos = '<span class="pos-dq">Descalificada</span>';
    else if (a.pos == null) pos = '<span class="pos-nula">—</span>';
    else pos = '<span class="pos' + (a.pos <= 3 ? ' p' + a.pos : '') + '">' + a.pos + '</span>' + (a.empate ? ' <span class="emp">empate</span>' : '');
    return '<tr' + (dq ? ' class="fila-dq"' : (a.pos != null && a.pos <= 3 ? ' class="premio"' : '')) + '>' +
      '<td class="c-pos">' + pos + '</td><td class="c-esc">' + esc(a.escuela.nombre) + '</td>' +
      '<td class="c-p">' + nivel('elemental') + '</td><td class="c-p">' + nivel('intermedia') + '</td><td class="c-p">' + nivel('superior') + '</td>' +
      '<td class="c-total">' + (dq ? '<span class="tenue">—</span>' : a.total) + '</td>' +
      '<td>' + a.mesas + (a.mesasDq ? ' <span class="tenue">(' + a.mesasDq + ' ' + plural(a.mesasDq, 'descalificada', 'descalificadas') + ')</span>' : '') + '</td></tr>';
  }).join('');
  return '<div class="tabla-desliz"><table class="hoja"><thead><tr><th scope="col" class="c-pos">Posición</th><th scope="col" class="c-esc">Escuela</th>' +
    '<th scope="col">Elemental</th><th scope="col">Intermedia</th><th scope="col">Superior</th><th scope="col" class="c-total">Total</th><th scope="col">Mesas</th></tr></thead>' +
    '<tbody>' + filas + '</tbody></table></div>';
}
function textoEstadoCopa(copa) {
  if (!copa.hayDatos) return 'Sin rondas completadas.';
  if (copa.provisional) return 'Resultados provisionales: hay niveles con rondas pendientes.';
  if (copa.apelaciones) return 'Resultados sujetos a apelaciones pendientes.';
  return 'Resultados finales.';
}
function vistaCopa(copa) {
  let cuerpo;
  if (ui.ocultarEscuelas) cuerpo = '<p class="aviso-linea">La Copa no se muestra mientras las escuelas están ocultas.</p>';
  else if (!copa.filas.length) cuerpo = '<p class="vacio">No hay mesas con escuela asignada. <a href="#config" data-tab="config">Registrar mesas y escuelas</a></p>';
  else {
    cuerpo = '<p class="ayuda">Total de cada escuela: suma de los totales de sus mesas activas en los tres niveles. Las escuelas con el mismo total comparten posición. ' + textoEstadoCopa(copa) + '</p>' +
      (copa.sinEscuela ? '<p class="aviso-linea atencion">' + copa.sinEscuela + ' ' + plural(copa.sinEscuela, 'mesa activa no tiene escuela asignada; sus puntos no cuentan', 'mesas activas no tienen escuela asignada; sus puntos no cuentan') + ' para la Copa.</p>' : '') +
      '<section class="bloque" data-k="copa-tabla">' + tablaCopa(copa) + '</section>';
  }
  return '<div class="vista" data-k="v-copa"><div class="encabezado-vista"><h2>Copa de escuelas</h2></div>' + cuerpo + '</div>';
}

/* ---------- Vista pública ---------- */
function vistaPublica(clas, copa) {
  const nivelId = ui.pubNivel === 'copa' && !ui.pubEscuelas ? 'elemental' : ui.pubNivel;
  const botones = NIVELES.map(function (nv) {
    return '<button type="button" data-acc="pub-nivel" data-v="' + nv.id + '" aria-pressed="' + (nivelId === nv.id) + '"' + (nivelId === nv.id ? ' class="activo"' : '') + '>' + nv.nombre + '</button>';
  }).join('') +
    '<button type="button" data-acc="pub-nivel" data-v="copa" aria-pressed="' + (nivelId === 'copa') + '"' + (nivelId === 'copa' ? ' class="activo"' : '') +
    (ui.pubEscuelas ? '' : ' disabled title="Disponible al mostrar las escuelas"') + '>Copa</button>';
  let titulo;
  let estadoTxt;
  let tabla;
  let notas = '';
  if (nivelId === 'copa') {
    titulo = 'Copa de escuelas';
    estadoTxt = textoEstadoCopa(copa);

  } else {
    const nv = NIVELES.find(function (x) { return x.id === nivelId; });

    titulo = 'Nivel ' + nv.nombre;
    if (!c.nMesas) estadoTxt = '';
    else if (c.k === 0) estadoTxt = 'Sin rondas completadas.';
    else if (c.k < N_PROB) estadoTxt = 'Resultados tras la ronda ' + c.k + ' de ' + N_PROB + '.';
    else if (c.estado === 'desempate') estadoTxt = 'Diez rondas completadas. Desempate pendiente.';
    else estadoTxt = c.apelacionesPendientes ? 'Resultados sujetos a apelaciones pendientes.' : 'Resultados finales.';
    tabla = c.nMesas

      : '<p class="vacio">No hay mesas registradas en este nivel.</p>';
    const lista = [];
    c.grupos.filter(function (g) { return g.premiado; }).forEach(function (g) { notasDesempate(g).forEach(function (t) { lista.push(t); }); });
    if (lista.length) notas = '<ul class="notas-publicas">' + lista.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  }
  return '<div class="vista" data-k="v-publica">' +
    '<div class="barra-publica no-imprimir">' +
    '<div class="segmento" role="group" aria-label="Resultados que se muestran">' + botones + '</div>' +
    '<label class="etiqueta-campo">Orden <select class="campo" data-acc="pub-orden"' + (nivelId === 'copa' ? ' disabled' : '') + '>' +
    '<option value="posicion"' + (ui.pubOrden === 'posicion' ? ' selected' : '') + '>Por posición</option>' +
    '<option value="mesa"' + (ui.pubOrden === 'mesa' ? ' selected' : '') + '>Por número de mesa</option></select></label>' +
    '<label class="interruptor"><input type="checkbox" data-acc="pub-escuelas"' + (ui.pubEscuelas ? ' checked' : '') + '> Mostrar escuelas</label>' +
    '<button type="button" class="btn" data-acc="pantalla-completa">Pantalla completa</button></div>' +
    '<div class="lienzo-publico" id="lienzo-publico">' +
    '<div class="cab-publica"><p class="evento">' + esc(estado.evento) + '</p><h2>' + titulo + '</h2><p class="estado">' + estadoTxt + '</p></div>' +
    tabla + notas + '</div></div>';
}

      '<div class="acciones"><label class="etiqueta-campo">Clave <input type="text" class="campo" id="sinc-clave" data-libre autocomplete="off"></label>' +

/* ---------- Render ---------- */
function clasificarTodo() {
  const clas = {};
  NIVELES.forEach(function (nv) { clas[nv.id] = clasificarNivel(estado, nv.id); });
  return clas;
}
function render() {
  const clas = clasificarTodo();
  const copa = clasificarCopa(estado, clas);

  document.body.classList.toggle('sin-escuelas', ui.ocultarEscuelas);

  if (ui.tab === 'config') html = vistaConfig();
  else if (ui.tab === 'copa') html = vistaCopa(copa);
  else if (ui.tab === 'publica') html = vistaPublica(clas, copa);
  else if (ui.tab === 'datos') html = vistaDatos();

// Actualiza solo la cabecera (estado de guardado y de sincronización); en «Datos y reglas» ese estado también está en la vista.
function renderMarco() {
