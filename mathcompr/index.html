}
function irA(tab) {
  if (PESTANAS.indexOf(tab) < 0) return;
  ui.tab = tab;
  try { history.replaceState(null, '', '#' + tab); } catch (e) { /* sin historial disponible */ }
  render();
  window.scrollTo(0, 0);
}
function leerHash() {
  const h = location.hash.replace(/^#\/?/, '');
  return PESTANAS.indexOf(h) >= 0 ? h : null;
}

/* ---------- Acciones ---------- */
function alEscribirPunto(el) {
  const n = el.dataset.n;
  const id = el.dataset.id;
  const col = +el.dataset.c;
  const m = buscarMesa(n, id);
  if (!m) return;
  const leido = leerPunto(el.value);
  const nuevo = leido === undefined ? null : leido;
  el.classList.toggle('invalido', leido === undefined);
  if (leido === undefined) aviso('Valor no admitido: la puntuación es un entero de 0 a ' + MAX_PTS + '.');
  if (m.p[col] !== nuevo) ejecutar([{ t: 'punto', n: n, id: id, c: col, v: nuevo }], 'p:' + n + ':' + id + ':' + col);
}
function sincronizarPunto(el) {
  const m = buscarMesa(el.dataset.n, el.dataset.id);
  const v = m ? m.p[+el.dataset.c] : null;
  el.value = v == null ? '' : String(v);
  el.classList.remove('invalido');
}
function anadirEscuelaDesdeCampo() {
  const campo = document.getElementById('nueva-escuela');
  if (!campo) return;
  const nombre = limpiarNombre(campo.value);
  if (!nombre) { aviso('Escriba el nombre de la escuela.'); campo.focus(); return; }
  if (escuelaPorNombre(nombre)) { aviso('La escuela «' + nombre + '» ya está registrada.'); campo.select(); return; }
  ejecutar([{ t: 'escNueva', id: nuevoId('e'), nombre: nombre }]);
  campo.value = '';
  campo.focus();
}
function renombrarEscuela(el) {
  const id = el.dataset.id;
  const e = escuelaPorId(id);
  if (!e) return;
  const nombre = limpiarNombre(el.value);
  if (!nombre) { aviso('El nombre de la escuela no puede quedar vacío.'); el.value = e.nombre; return; }
  if (nombre === e.nombre) { el.value = e.nombre; return; }
  const otra = escuelaPorNombre(nombre, id);
  if (!otra) { ejecutar([{ t: 'esc', id: id, campo: 'nombre', v: nombre }]); return; }
  const otraId = otra.id;
  el.value = e.nombre;
  dialogo({
    titulo: 'Combinar escuelas',
    cuerpoHtml: '<p>Ya existe la escuela «' + esc(otra.nombre) + '». Al combinarlas, las mesas de «' + esc(e.nombre) + '» pasan a «' + esc(otra.nombre) + '».</p>',
    aceptar: 'Combinar'
  }).then(function (ok) {
    if (ok) ejecutar([{ t: 'escCombinar', de: id, a: otraId }]);
    else render();
  });
}
function asignarEscuela(el) {
  const n = el.dataset.n;
  const id = el.dataset.id;
  const m = buscarMesa(n, id);
  if (!m) return;
  const nombre = limpiarNombre(el.value);
  if (!nombre) {
    if (m.escuelaId) ejecutar([{ t: 'mesaEsc', n: n, id: id, nombre: '' }]);
    else el.value = '';
    return;
  }
  const existente = escuelaPorNombre(nombre);
  if (!existente || m.escuelaId !== existente.id) ejecutar([{ t: 'mesaEsc', n: n, id: id, nombre: nombre, eid: nuevoId('e') }]);
  const asignada = escuelaPorNombre(nombre);
  if (asignada) el.value = asignada.nombre;
  if (!existente && asignada) aviso('Escuela nueva registrada: «' + asignada.nombre + '».');
}
function eliminarEscuela(id) {
  const e = escuelaPorId(id);
  if (!e) return;
  let enUso = 0;
  NIVELES.forEach(function (nv) { enUso += estado.niveles[nv.id].mesas.filter(function (m) { return m.escuelaId === id; }).length; });
  if (!enUso) { ejecutar([{ t: 'escBorrar', id: id }]); return; }
  dialogo({
    titulo: 'Eliminar escuela',
    cuerpoHtml: '<p>«' + esc(e.nombre) + '» está asignada a ' + enUso + ' ' + plural(enUso, 'mesa', 'mesas') + '. Al eliminarla, ' + plural(enUso, 'esa mesa queda', 'esas mesas quedan') + ' sin escuela asignada.</p>',
    aceptar: 'Eliminar', peligro: true
  }).then(function (ok) { if (ok) ejecutar([{ t: 'escBorrar', id: id }]); });
}
function anadirMesas(n) {
  const campo = document.getElementById('cantidad-' + n);
  let cantidad = campo ? parseInt(campo.value, 10) : 1;
  if (!(cantidad >= 1)) cantidad = 1;
  if (cantidad > 100) cantidad = 100;
  const lista = estado.niveles[n].mesas;
  if (lista.length + cantidad > 300) { aviso('El nivel admite un máximo de 300 mesas.'); return; }
  let siguiente = lista.reduce(function (mx, m) { return Math.max(mx, m.numero); }, 0) + 1;
  const ops = [];
  for (let i = 0; i < cantidad; i++) { ops.push({ t: 'mesaNueva', n: n, mesa: nuevaMesa(siguiente) }); siguiente += 1; }
  ejecutar(ops);
  if (campo) campo.value = '1';
}
function cambiarNumeroMesa(el) {
  const n = el.dataset.n;
  const id = el.dataset.id;
  const m = buscarMesa(n, id);
  if (!m) return;
  const t = el.value.trim();
  const v = /^\d{1,4}$/.test(t) ? parseInt(t, 10) : NaN;
  if (!(v >= 1)) { aviso('El número de mesa es un entero de 1 a 9999.'); el.value = m.numero; return; }
  if (v === m.numero) { el.value = m.numero; return; }
  if (estado.niveles[n].mesas.some(function (x) { return x.id !== id && x.numero === v; })) {
    aviso('Ya existe la mesa ' + v + ' en este nivel.');
    el.value = m.numero;
    return;
  }
  ejecutar([{ t: 'mesa', n: n, id: id, campo: 'numero', v: v }]);
}
function eliminarMesa(n, id) {
  const m = buscarMesa(n, id);
  if (!m) return;
  const conDatos = m.p.some(function (v) { return v != null; }) || m.d.some(function (v) { return v != null; }) || m.dq || m.obs || m.ap.some(function (a) { return a; });
  if (!conDatos) { ejecutar([{ t: 'mesaBorrar', n: n, id: id }]); return; }
  const nv = NIVELES.find(function (x) { return x.id === n; });
  dialogo({
    titulo: 'Eliminar mesa',
    cuerpoHtml: '<p>La mesa ' + m.numero + ' del nivel ' + nv.nombre + ' tiene datos registrados. Al eliminarla se pierden sus puntuaciones e incidencias.</p>',
    aceptar: 'Eliminar', peligro: true
  }).then(function (ok) { if (ok) ejecutar([{ t: 'mesaBorrar', n: n, id: id }]); });
}
function cambiarDesempate(el) {
  const n = el.dataset.n;
  const id = el.dataset.id;
  const m = buscarMesa(n, id);
  if (!m) return;
  const sig = el.dataset.sig;
  if (el.dataset.acc === 'jueces') {
    const t = el.value.trim();
    let v = null;
    if (t !== '') {
      v = /^\d{1,2}$/.test(t) && parseInt(t, 10) >= 1 ? parseInt(t, 10) : undefined;
      if (v === undefined) { aviso('El orden asignado por los jueces es un entero a partir de 1.'); el.value = ''; v = null; }
    }
    const actual = m.dgs[2] === sig ? m.dj : null;
    if (actual === v) { render(); return; }
    ejecutar([{ t: 'jue', n: n, id: id, v: v, sig: sig }]);
    return;
  }
  const i = +el.dataset.i;
  let v = leerPunto(el.value);
  if (v === undefined) { aviso('Valor no admitido: la puntuación de desempate es un entero de 0 a ' + MAX_PTS + '.'); el.value = ''; v = null; }
  const actual = m.dgs[i] === sig ? m.d[i] : null;
  if (actual === v) { render(); return; }
  ejecutar([{ t: 'des', n: n, id: id, i: i, v: v, sig: sig }]);
}

function sello() {
  const d = new Date();
  return d.getFullYear() + '-' + dosDigitos(d.getMonth() + 1) + '-' + dosDigitos(d.getDate()) + '_' + dosDigitos(d.getHours()) + dosDigitos(d.getMinutes());
}
function descargar(nombre, contenido, tipo) {
  try {
    const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch (e) {
    aviso('El navegador no permitió la descarga.');
    return false;
  }
}
function exportarRespaldo() {
  const paquete = { aplicacion: 'priml-resultados', formato: 1, exportado: new Date().toISOString(), estado: estado };
  if (descargar('priml_respaldo_' + sello() + '.json', JSON.stringify(paquete, null, 1), 'application/json')) {
    cambiosSinRespaldo = false;
    aviso('Respaldo descargado.');
  }
}
function exportarCsv(cual) {
  const texto = cual === 'copa' ? csvCopa(estado) : csvNivel(estado, cual);
  if (descargar('priml_' + cual + '_' + sello() + '.csv', texto, 'text/csv;charset=utf-8')) aviso('Archivo CSV descargado.');
}
function avisoDeEquipos() {
  return sincActiva() ? ' El cambio se aplica en todos los equipos conectados.' : '';
}
function importarRespaldo(texto) {
  let bruto;
  try { bruto = JSON.parse(texto); } catch (e) { bruto = null; }
  const nuevo = sanear(bruto && bruto.estado ? bruto.estado : bruto);
  if (!nuevo) { aviso('El archivo no corresponde a un respaldo de esta página.'); return; }
  nuevo.evento = nombreVigente(nuevo.evento);
  let fecha = '';
  if (bruto && typeof bruto.exportado === 'string' && !isNaN(Date.parse(bruto.exportado))) {
    const d = new Date(bruto.exportado);
    fecha = ' generado el ' + dosDigitos(d.getDate()) + '/' + dosDigitos(d.getMonth() + 1) + '/' + d.getFullYear() + ' a las ' + dosDigitos(d.getHours()) + ':' + dosDigitos(d.getMinutes());
  }
  const resumen = NIVELES.map(function (nv) { return nv.nombre + ', ' + nuevo.niveles[nv.id].mesas.length; }).join('; ');
  dialogo({
    titulo: 'Cargar respaldo',
    cuerpoHtml: '<p>Respaldo' + fecha + '. Contiene ' + nuevo.escuelas.length + ' ' + plural(nuevo.escuelas.length, 'escuela', 'escuelas') + ' y estas mesas por nivel: ' + resumen + '.' + avisoDeEquipos() + '</p>' +
      '<fieldset><legend>Modo de carga</legend>' +
      '<label><input type="radio" name="modo" value="todo" checked> Sustituir todos los datos actuales por los del respaldo</label>' +
      '<label><input type="radio" name="modo" value="niveles"> Incorporar solo los niveles seleccionados y conservar el resto</label>' +
      '<div class="sub">' + NIVELES.map(function (nv) { return '<label><input type="checkbox" name="nivel" value="' + nv.id + '"> ' + nv.nombre + '</label>'; }).join('') + '</div></fieldset>',
    aceptar: 'Cargar',
    leer: function (dlg) {
      const modo = dlg.querySelector('input[name="modo"]:checked').value;
      const niveles = Array.from(dlg.querySelectorAll('input[name="nivel"]:checked')).map(function (x) { return x.value; });
      if (modo === 'niveles' && !niveles.length) { aviso('Seleccione al menos un nivel.'); return undefined; }
      return { modo: modo, niveles: niveles };
    }
  }).then(function (r) {
    if (!r) return;
    const resultado = r.modo === 'todo' ? nuevo : incorporarNiveles(estado, nuevo, r.niveles);
    ejecutar([{ t: 'todo', estado: resultado }]);
    aviso('Respaldo cargado.');
  });
}
function datosDeEjemplo() {
  const e = estadoInicial();
  e.evento = e.evento + MARCA_EJEMPLO;
  ['Escuela A', 'Escuela B', 'Escuela C', 'Escuela D', 'Escuela E', 'Escuela F', 'Escuela G', 'Escuela H'].forEach(function (nombre) {
    e.escuelas.push({ id: nuevoId('e'), nombre: nombre, descalificada: false });
  });
  const escuela = function (i) { return e.escuelas[i % e.escuelas.length].id; };
  const elemental = [
    [10, 9, 8, 9, 7, 10, 6, 9, 8, 9], [9, 8, 8, 7, 7, 9, 6, 8, 8, 8], [8, 9, 7, 8, 6, 9, 7, 8, 7, 9], [7, 7, 6, 8, 5, 8, 5, 7, 6, 7],
    [6, 8, 7, 6, 6, 7, 4, 6, 5, 6], [5, 6, 5, 7, 4, 6, 5, 5, 4, 5], [5, 6, 4, 7, 5, 6, 5, 5, 5, 4], [4, 5, 3, 6, 2, 5, 3, 4, 3, 4]
  ];
  elemental.forEach(function (p, i) {
    const m = nuevaMesa(i + 1);
    m.p = p.slice();
    m.escuelaId = escuela(i);
    e.niveles.elemental.mesas.push(m);
  });
  let semilla = 20262027;
  const azar = function () { semilla = (semilla * 1103515245 + 12345) % 2147483648; return semilla / 2147483648; };
  for (let i = 0; i < 8; i++) {
    const m = nuevaMesa(i + 1);
    m.escuelaId = escuela(i + 3);
    for (let j = 0; j < 6; j++) m.p[j] = 3 + Math.floor(azar() * 8);
    if (i < 5) m.p[6] = 3 + Math.floor(azar() * 8);
    e.niveles.intermedia.mesas.push(m);
  }
  const superior = [
    [10, 9, 9, 8, 8, 10, 9, 8, 9, 8], [9, 10, 8, 9, 8, 9, 9, 9, 8, 9], [8, 8, 9, 7, 7, 9, 8, 7, 8, 7],
    [7, 9, 6, 8, 6, 8, 7, 8, 6, 7], [9, 9, 9, 9, 9, 9, 9, 9, 9, 9], [6, 7, 5, 7, 5, 7, 6, 6, 5, 6]
  ];
  superior.forEach(function (p, i) {
    const m = nuevaMesa(i + 1);
    m.p = p.slice();
    m.escuelaId = escuela(i + 5);
    e.niveles.superior.mesas.push(m);
  });
  const sup = e.niveles.superior.mesas;
  sup[4].dq = true;
  sup[4].obs = 'Uso de un dispositivo electrónico (regla 3).';
  sup[2].ap[0] = 'aceptada';
  sup[2].obs = 'Apelación del problema 3: error de suma corregido.';
  sup[3].ap[1] = 'pendiente';
  const c = clasificarNivel(e, 'superior');
  c.filas.forEach(function (f) {
    if (!f.pideD1) return;
    f.mesa.d[0] = f.mesa.numero === 1 ? 9 : 6;
    f.mesa.dgs[0] = f.sig1;
  });
  return e;
}

/* ---------- Eventos ---------- */
function alCambiar(ev) {
  const el = ev.target;
  if (!el || !el.dataset) return;
  if (el.id === 'archivo-respaldo') {
    const archivo = el.files && el.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = function () { importarRespaldo(String(lector.result)); };
    lector.onerror = function () { aviso('No fue posible leer el archivo.'); };
    lector.readAsText(archivo);
    el.value = '';
    return;
  }
  const n = el.dataset.n;
  const id = el.dataset.id;
  switch (el.dataset.acc) {
    case 'desempate':
    case 'jueces':
      cambiarDesempate(el);
      break;
    case 'apelacion':
      ejecutar([{ t: 'mesa', n: n, id: id, campo: 'ap' + el.dataset.i, v: el.value }]);
      break;
    case 'dq-mesa':
      ejecutar([{ t: 'mesa', n: n, id: id, campo: 'dq', v: el.checked }]);
      break;
    case 'obs': {
      const texto = el.value.replace(/\s+/g, ' ').trim().slice(0, 300);
      const m = buscarMesa(n, id);
      if (m && m.obs !== texto) ejecutar([{ t: 'mesa', n: n, id: id, campo: 'obs', v: texto }]);
      else if (m) el.value = m.obs;
      break;
    }
    case 'evento': {
      const nombre = limpiarNombre(el.value);
      if (!nombre) { aviso('El nombre del evento no puede quedar vacío.'); el.value = estado.evento; break; }
      if (nombre !== estado.evento) ejecutar([{ t: 'evento', v: nombre }]);
      else el.value = estado.evento;
      break;
    }
    case 'escuela-nombre': renombrarEscuela(el); break;
    case 'escuela-dq':
      ejecutar([{ t: 'esc', id: id, campo: 'descalificada', v: el.checked }]);
      break;
    case 'mesa-numero': cambiarNumeroMesa(el); break;
    case 'mesa-escuela': asignarEscuela(el); break;
    case 'ocultar-escuelas': ui.ocultarEscuelas = el.checked; guardarUi(); render(); break;
    case 'acumulado': ui.acumulado = el.checked; guardarUi(); render(); break;
    case 'pub-orden': ui.pubOrden = el.value === 'mesa' ? 'mesa' : 'posicion'; guardarUi(); render(); break;
    case 'pub-escuelas':
      ui.pubEscuelas = el.checked;
      if (!el.checked && ui.pubNivel === 'copa') ui.pubNivel = 'elemental';
      guardarUi();
      render();
      break;
    default:
  }
}
function alPulsar(ev) {
  const enlace = ev.target.closest('a[data-tab]');
  if (enlace) { ev.preventDefault(); irA(enlace.dataset.tab); return; }
  const b = ev.target.closest('button[data-acc]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.acc) {
    case 'deshacer': deshacer(); break;
    case 'rehacer': rehacer(); break;
    case 'tema': ui.tema = ui.tema === 'noche' ? 'claro' : 'noche'; guardarUi(); render(); break;
    case 'imprimir': window.print(); break;
    case 'add-escuela': anadirEscuelaDesdeCampo(); break;
    case 'del-escuela': eliminarEscuela(d.id); break;
    case 'add-mesas': anadirMesas(d.n); break;
    case 'del-mesa': eliminarMesa(d.n, d.id); break;
    case 'pub-nivel': ui.pubNivel = d.v; guardarUi(); render(); break;
    case 'pantalla-completa': {
      const lienzo = document.getElementById('lienzo-publico');
      if (document.fullscreenElement) document.exitFullscreen();
      else if (lienzo && lienzo.requestFullscreen) lienzo.requestFullscreen().catch(function () { aviso('El navegador no permitió la pantalla completa.'); });
      else aviso('El navegador no permite la pantalla completa.');
      break;
    }
    case 'exportar-json': exportarRespaldo(); break;
    case 'importar-json': document.getElementById('archivo-respaldo').click(); break;
    case 'csv': exportarCsv(d.v); break;
    case 'ejemplo': {
      const cargar = function () { ejecutar([{ t: 'todo', estado: datosDeEjemplo() }]); aviso('Datos de ejemplo cargados.'); };
      if (!hayDatos()) { cargar(); break; }
      dialogo({ titulo: 'Cargar datos de ejemplo', cuerpoHtml: '<p>Los datos de ejemplo sustituyen las mesas, escuelas y puntuaciones actuales.' + avisoDeEquipos() + '</p>', aceptar: 'Sustituir', peligro: true })
        .then(function (ok) { if (ok) cargar(); });
      break;
    }
    case 'borrar-todo':
      dialogo({
        titulo: 'Borrar todos los datos',
        cuerpoHtml: '<p>Se eliminan todas las mesas, escuelas, puntuaciones e incidencias' + (sincActiva() ? ' en todos los equipos conectados.' : ' guardadas en este navegador.') + '</p>',
        aceptar: 'Borrar todo', peligro: true
      }).then(function (ok) { if (ok) { ejecutar([{ t: 'todo', estado: estadoInicial() }]); aviso('Datos borrados.'); } });
      break;
    case 'sinc-conectar': {
      const u = document.getElementById('sinc-url');
      const k = document.getElementById('sinc-clave');
      conectar(u ? u.value : '', k ? k.value : '');
      break;
    }
    case 'sinc-invitar': copiarInvitacion(); break;
    case 'sinc-ahora': aviso('Sincronizando…'); programar(0); break;
    case 'sinc-desconectar': desconectar(); break;
    default:
  }
}
function alTeclear(ev) {
  if (!document.getElementById('capa-dialogo').hidden) return;
  const el = ev.target;
  if (!el || !el.matches) return;
  if (el.matches('input[data-acc="punto"]')) {
    const r = +el.dataset.r;
    const c = +el.dataset.c;
    let nr = r;
    let nc = c;
    if (ev.key === 'ArrowUp') nr -= 1;
    else if (ev.key === 'ArrowDown' || ev.key === 'Enter') nr += 1;
    else if (ev.key === 'ArrowLeft') nc -= 1;
    else if (ev.key === 'ArrowRight') nc += 1;
    else return;
    ev.preventDefault();
    const tabla = el.closest('table');
    let destino = tabla.querySelector('input[data-acc="punto"][data-r="' + nr + '"][data-c="' + nc + '"]');
    if (!destino && ev.key === 'Enter') destino = tabla.querySelector('input[data-acc="punto"][data-r="0"][data-c="' + (c + 1) + '"]');
    if (destino) destino.focus();
    return;
  }
  if (ev.key !== 'Enter') return;
  if (el.id === 'nueva-escuela') { ev.preventDefault(); anadirEscuelaDesdeCampo(); return; }
  if (el.id && el.id.indexOf('cantidad-') === 0) { ev.preventDefault(); anadirMesas(el.id.slice(9)); return; }
  if (el.matches('input[data-acc="desempate"], input[data-acc="jueces"], input[data-acc="obs"], input[data-acc="mesa-numero"], input[data-acc="escuela-nombre"], input[data-acc="evento"]')) {
    ev.preventDefault();
    const tabla = el.closest('table');
    if (tabla) {
      const selector = 'input[data-acc="' + el.dataset.acc + '"]' + (el.dataset.i != null ? '[data-i="' + el.dataset.i + '"]' : '');
      const lista = Array.from(tabla.querySelectorAll(selector));
      const siguiente = lista[lista.indexOf(el) + 1];
      if (siguiente) { siguiente.focus(); return; }
    }
    el.blur();
  }
}

function iniciar() {
  leerUi();
  guardadoOk = probarAlmacen();
  try {
    const texto = localStorage.getItem(CLAVE);
    const cargado = texto ? sanear(JSON.parse(texto)) : null;
    if (cargado) estado = cargado;
  } catch (e) { /* sin datos guardados */ }
  leerSinc();
  actualizarNombrePredeterminado();
  const conMesas = NIVELES.find(function (nv) { return estado.niveles[nv.id].mesas.length > 0; });
  ui.tab = leerHash() || (conMesas ? conMesas.id : 'config');

  document.addEventListener('input', function (ev) {
    if (ev.target.matches && ev.target.matches('input[data-acc="punto"]')) alEscribirPunto(ev.target);
  });
  document.addEventListener('change', alCambiar);
  document.addEventListener('click', alPulsar);
  document.addEventListener('keydown', alTeclear);
  document.addEventListener('focusin', function (ev) {
    if (ev.target.matches && ev.target.matches('input[data-acc="punto"], input[data-acc="desempate"], input[data-acc="jueces"], input[data-acc="mesa-numero"], input[data-acc="mesa-escuela"]')) ev.target.select();
  });
  document.addEventListener('focusout', function (ev) {
    if (ev.target.matches && ev.target.matches('input[data-acc="punto"]')) sincronizarPunto(ev.target);
  });
  window.addEventListener('hashchange', function () {
    if (/^#conectar=/.test(location.hash)) { atenderInvitacion(); return; }
    const t = leerHash();
    if (t && t !== ui.tab) { ui.tab = t; render(); window.scrollTo(0, 0); }
  });
  // Otra ventana del mismo navegador modificó los datos o la conexión: se adopta lo guardado.
  window.addEventListener('storage', function (ev) {
    if (ev.key === CLAVE && ev.newValue) {
      let nuevo = null;
      try { nuevo = sanear(JSON.parse(ev.newValue)); } catch (e) { nuevo = null; }
      if (!nuevo) return;
      estado = nuevo;
      ultimaClave = '';
      render();
    } else if (ev.key === CLAVE_SINC) {
      const antes = sinc.url;
      leerSinc();
      if (sinc.url !== antes) { sinc.error = ''; sinc.reintentos = 0; sinc.ultimaSinc = null; programar(sincActiva() ? 500 : undefined); }
      render();
    }
  });
  window.addEventListener('online', function () { if (sincActiva()) programar(0); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && sincActiva()) programar(0); });
  window.addEventListener('beforeunload', function (ev) {
    const sinEnviar = sincActiva() && sinc.cola.length > 0 && !guardadoOk;
    if ((!guardadoOk && cambiosSinRespaldo && !sincActiva()) || sinEnviar) { ev.preventDefault(); ev.returnValue = ''; }
  });
  render();
  if (sincActiva()) programar(0);
  atenderInvitacion();
}

iniciar();
})();
</script>
